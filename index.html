function pi_small(n){if(n<2)return 0;let sieve=new Uint8Array(n+1);let count=0;for(let i=2;i<=n;i++){if(!sieve[i]){count++;if((i*i)<=n)for(let j=i*i;j<=n;j+=i)sieve[j]=1}}return count}
function pi_seg(n){
 if(n<5000000) return pi_small(n);
 let limit=Math.floor(Math.sqrt(n));
 let primes=[];let mark=new Uint8Array(limit+1);
 for(let i=2;i<=limit;i++)if(!mark[i]){primes.push(i);if(i*i<=limit)for(let j=i*i;j<=limit;j+=i)mark[j]=1}
 let count=primes.length;
 let low=limit+1; let high=Math.min(low+1000000-1,n);
 let segment=new Uint8Array(1000000);
 while(low<=n){
   segment.fill(0);
   for(let p of primes){
     let start=Math.max(p*p, Math.floor((low+p-1)/p)*p);
     for(let j=start;j<=high;j+=p) segment[j-low]=1;
   }
   for(let i=low;i<=high;i++) if(!segment[i-low]) count++;
   low=high+1; high=Math.min(low+1000000-1,n);
 }
 return count;
}
